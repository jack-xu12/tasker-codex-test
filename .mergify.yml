queue_rules:
  - name: default
    # 队首 PR 必须同时满足这些条件才会被真正合并
    merge_conditions:
      - base = dev
      - label = ready-to-merge
      - "-draft"

pull_request_rules:
  - name: 进入 dev 合并队列
    conditions:
      - base = dev
      - label = ready-to-merge
      - "-draft"
      - approved-reviews-by >= 1
      - changes-requested-reviews-by = 0
    actions:
      queue:
        name: default
